services:
  fluxcaler-opencode:
    container_name: fluxcaler-opencode
    image: ghcr.io/businessarchi/fluxcaler-opencode:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OPENCODE_DEFAULT_MODEL: ${OPENCODE_DEFAULT_MODEL:-anthropic/claude-sonnet-4-6}
      DARIO_PORT: 3456
      OPENCODE_PORT: 4096
    ports:
      - ${APP_PORT}:4096
    volumes:
      - ${APP_DATA_DIR}/data/dario:/root/.dario
      - ${APP_DATA_DIR}/data/opencode:/root/.config/opencode
      - ${APP_DATA_DIR}/data/opencode-state:/root/.local/share/opencode
    networks:
      - tipi_main_network
    labels:
      runtipi.managed: true
      traefik.enable: false

networks:
  tipi_main_network:
    external: true
