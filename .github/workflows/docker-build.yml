name: Build & push image

on:
  push:
    branches: [main]
    paths:
      - apps/fluxcaler-opencode/Dockerfile
      - apps/fluxcaler-opencode/entrypoint.sh
      - .github/workflows/docker-build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Read version from config.json
        id: meta
        run: |
          VERSION=$(jq -r .version apps/fluxcaler-opencode/config.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: apps/fluxcaler-opencode
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fluxcaler-opencode:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/fluxcaler-opencode:latest
